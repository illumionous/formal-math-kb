name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: lake update
      - run: lake exe cache get
      - run: lake build
      - run: python -m pipeline.validate_kb --kb kb --lean required
      - run: python -m pipeline.generate --kb kb --out /tmp/sft.jsonl --n 20 --seed 7
      - run: python -m pipeline.verify --in /tmp/sft.jsonl --out /tmp/verified.jsonl --lean required
      - run: python -m pipeline.dedup --in /tmp/verified.jsonl --out /tmp/final.jsonl
